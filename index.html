<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>住宅平面圖</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --paper: #ffffff;
      --line: #1f2937;
      --light-line: #6b7280;
      --accent: #2563eb;
      --text: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .sheet {
      width: min(100%, 980px);
      background: var(--paper);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #4b5563;
      font-size: 13px;
    }

    svg {
      width: 100%;
      height: auto;
      border: 1px solid #d1d5db;
      background: #fff;
    }

    .wall { stroke: var(--line); stroke-width: 10; fill: none; }
    .inner-wall { stroke: var(--line); stroke-width: 6; fill: none; }
    .fixture { stroke: #374151; stroke-width: 3; fill: none; }
    .furniture { stroke: #6b7280; stroke-width: 3; fill: #f9fafb; }
    .zone { fill: #eef2ff; stroke: #93c5fd; stroke-width: 2; stroke-dasharray: 8 6; }
    .label { font-size: 18px; fill: #111827; font-weight: 600; }
    .small { font-size: 14px; fill: #374151; }
    .dim { stroke: var(--accent); stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    .dim-text { font-size: 14px; fill: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>室內配置平面圖（重繪版）</h1>
    <p class="subtitle">依手稿整理為清晰平面圖示意，包含玄關、衛浴、廚房、客廳與臥房區。</p>

    <svg viewBox="0 0 900 1500" role="img" aria-label="住宅平面配置圖">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"></path>
        </marker>
      </defs>

      <!-- 外牆 -->
      <path class="wall" d="M160 90 L150 110 L150 1420 L750 1420 L750 110 L730 90 Z" />

      <!-- 玄關與衛浴分區 -->
      <line class="inner-wall" x1="160" y1="1170" x2="530" y2="1170" />
      <line class="inner-wall" x1="530" y1="1170" x2="530" y2="1420" />
      <line class="inner-wall" x1="530" y1="1170" x2="750" y2="1170" />
      <line class="inner-wall" x1="620" y1="1170" x2="620" y2="1420" />

      <!-- 臥房區分隔 -->
      <line class="inner-wall" x1="160" y1="620" x2="750" y2="620" />

      <!-- 右側櫃體 -->
      <rect class="furniture" x="700" y="250" width="50" height="330" />
      <rect class="furniture" x="700" y="640" width="50" height="220" />

      <!-- 床位 -->
      <rect class="zone" x="360" y="300" width="290" height="290" />
      <text class="label" x="400" y="450">Queen Bed</text>
      <text class="small" x="430" y="474">188 × 188 cm</text>

      <!-- 沙發區 -->
      <rect class="zone" x="430" y="700" width="220" height="240" />
      <text class="label" x="500" y="830" text-anchor="middle">沙發區</text>

      <!-- 電視櫃 -->
      <rect class="furniture" x="180" y="820" width="95" height="260" />
      <text class="small" x="195" y="955" transform="rotate(-90 195 955)">TV 牆 / 收納</text>

      <!-- 餐桌 -->
      <rect class="furniture" x="560" y="1000" width="150" height="65" rx="4" />
      <text class="small" x="635" y="1040" text-anchor="middle">餐桌</text>

      <!-- 廚房中島 -->
      <rect class="furniture" x="420" y="1225" width="90" height="165" />
      <circle class="fixture" cx="465" cy="1320" r="26" />
      <text class="small" x="465" y="1210" text-anchor="middle">廚房檯面</text>

      <!-- 衛浴 -->
      <rect class="furniture" x="620" y="1210" width="120" height="190" />
      <ellipse class="fixture" cx="680" cy="1260" rx="36" ry="26" />
      <circle class="fixture" cx="680" cy="1350" r="24" />
      <text class="small" x="680" y="1200" text-anchor="middle">衛浴</text>

      <!-- 玄關門扇 -->
      <path class="fixture" d="M160 1420 A120 120 0 0 1 280 1300" />
      <line class="fixture" x1="160" y1="1420" x2="280" y2="1300" />
      <text class="small" x="185" y="1452">大門</text>

      <!-- 尺寸註記 -->
      <line class="dim" x1="120" y1="130" x2="120" y2="1410" />
      <text class="dim-text" x="92" y="780" transform="rotate(-90 92 780)">全長約 860 cm</text>

      <line class="dim" x1="170" y1="70" x2="740" y2="70" />
      <text class="dim-text" x="455" y="56" text-anchor="middle">室內寬約 380 cm</text>

      <!-- 區域名稱 -->
      <text class="label" x="205" y="170">臥房區</text>
      <text class="label" x="205" y="760">客廳區</text>
      <text class="label" x="200" y="1240">玄關 / 廚房區</text>

      <!-- 北向 -->
      <line class="fixture" x1="95" y1="180" x2="95" y2="110" />
      <polygon points="95,90 85,115 105,115" fill="#111827" />
      <text class="small" x="86" y="205">N</text>
    </svg>
  </main>
</body>
</html>
